# parcel — key overrides. Uncomment to rebind. Keys: "x", "X", "ctrl+x", "alt+x",
# "enter", "esc", "tab", "backtab", "space", "up", "down", "left", "right",
# "home", "end", "pgup", "pgdown", "backspace", "delete". Arrows always move.
# up = "k"
# down = "j"
# top = "g"
# bottom = "G"
# open = "enter"
# back = "esc"
# next_pane = "tab"
# search = "/"
# reply = "r"
# reply_all = "R"
# forward = "f"
# compose = "c"
# star = "s"
# toggle_read = "u"
# delete = "d"
# move = "m"
# archive = "a"
# palette = "ctrl+p"
# themes = "t"
# help = "?"
# quit = "q"
