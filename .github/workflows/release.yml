name: release
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: tar -czf parcel-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release parcel
      - uses: actions/upload-artifact@v4
        with: { name: 'parcel-${{ matrix.target }}', path: 'parcel-${{ matrix.target }}.tar.gz' }
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - run: sha256sum parcel-*.tar.gz > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            parcel-*.tar.gz
            checksums.txt
