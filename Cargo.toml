[package]
name = "parcel"
version = "0.1.0"
edition = "2024"
description = "A light, fast, yummy terminal mail client for any email CLI"
license = "MIT"

[dependencies]
ratatui = "0.30"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"

[dev-dependencies]
tempfile = "3"
insta = "1.49"

[profile.release]
lto = true
strip = true
opt-level = 3
codegen-units = 1
panic = "abort"
